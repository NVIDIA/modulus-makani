# SFNOv2 baselines for the LESS study.
#
# Channels, normalization and invariants follow the FourCastNet 3 setup (config/fourcastnet3.yaml), the
# architecture is the pure spectral SFNOv2 (makani/models/networks/sfnonet_v2.py). Three targets:
#
#   sfno_less_deterministic   L2 training, single member
#   sfno_less_crps            CRPS training with diffusion input noise, 16 members
#   sfno_less_less            LESS training; placeholder, inherits the CRPS target until it is defined

base_config: &BASE_CONFIG

    # metadata file for the dataset
    metadata_json_path: "/metadata/data.json"

    # data
    train_data_path: "/train"
    valid_data_path: "/test"
    inf_data_path: "/out_of_sample"
    exp_dir: "/runs"
    n_years: 1
    img_shape_x: 721
    img_shape_y: 1440

    # files used for normalization of the data
    min_path: "/stats/mins.npy"
    max_path: "/stats/maxs.npy"
    time_means_path:   "/stats/time_means.npy"
    global_means_path: "/stats/global_means.npy"
    global_stds_path:  "/stats/global_stds.npy"
    time_diff_means_path: "/stats/time_diff_means.npy"
    time_diff_stds_path: "/stats/time_diff_stds.npy"

    # architecture
    nettype: "SFNOv2"
    model_grid_type: "equiangular"
    sht_grid_type: "equiangular"  # internal grid = data grid, 721 x 1440, Clenshaw-Curtis quadrature everywhere
    scale_factor: 1               # keep the full 721 x 1440 grid internally: oversampled relative to lmax, so that
                                  # products from the nonlinearities alias less before the next spectral truncation
    lmax: 640                     # ERA5 is TL639 (l <= 639). Above the exact limit (360) of this grid, but the
                                  # Clenshaw-Curtis aliasing at 640 is < 1e-4 on ERA5 fields (720 would break down)
    embed_dim: 512
    num_layers: 6
    num_groups: 8                 # per-degree channel mixing in 64-channel groups: 42M spectral params per block
                                  # (dense would be 335M per block, 2B total, and does not fit at lmax 640)
    mlp_ratio: 2
    encoder_layers: 1
    normalization_layer: "instance_norm"
    pos_embed: "latitude"         # the only position-dependent parameter
    use_film: !!bool True         # spherical-mean conditioning in every block
    wind_spectral_scaling: "energy"
    skip: "identity"
    layer_scale_init: 0.1
    big_skip: !!bool True
    activation_function: "gelu"

    # learning dynamics
    lr: 5E-4
    max_epochs: 130
    batch_size: 16
    weight_decay: 0.0
    optimizer_type: "Adam"
    optimizer_beta1: 0.9
    optimizer_beta2: 0.95
    optimizer_max_grad_norm: 32

    # shorter "epochs" for more frequent reporting
    n_train_samples_per_epoch: 53760
    n_eval_samples: 512

    # scheduler
    scheduler: "ReduceLROnPlateau"
    scheduler_T_max: 120
    scheduler_factor: 0.8
    scheduler_patience: 5
    scheduler_step_size: 40
    scheduler_gamma: 0.5
    lr_warmup_steps: 0

    # wireup
    wireup_info: "mpi"
    wireup_store: "tcp"
    num_data_workers: 2
    num_visualization_workers: 2

    # time stepping: trained on the 6-hourly dataset, one step = 6 h; the model sees the last two states
    dt: 1
    n_history: 1
    prediction_type: "iterative"

    # validation
    valid_autoreg_steps: 19
    ics_type: "specify_number"
    save_raw_forecasts: !!bool True
    save_channel: !!bool False
    masked_acc: !!bool False
    maskpath: None
    perturb: !!bool False
    add_noise: !!bool False
    noise_std: 0.
    crop_size_x: None
    crop_size_y: None

    # channels: the FCN3 set (no sp). u/v pairs are recognized by name and encoded as vector fields
    channel_names: ["u10m", "v10m", "u100m", "v100m", "t2m", "msl", "tcwv", "u50", "u100", "u150", "u200", "u250", "u300", "u400", "u500", "u600", "u700", "u850", "u925", "u1000", "v50", "v100", "v150", "v200", "v250", "v300", "v400", "v500", "v600", "v700", "v850", "v925", "v1000", "z50", "z100", "z150", "z200", "z250", "z300", "z400", "z500", "z600", "z700", "z850", "z925", "z1000", "t50", "t100", "t150", "t200", "t250", "t300", "t400", "t500", "t600", "t700", "t850", "t925", "t1000", "q50", "q100", "q150", "q200", "q250", "q300", "q400", "q500", "q600", "q700", "q850", "q925", "q1000"]
    # zscore everywhere except the water channels. The stats must come from get_stats.py --wind_angle_aware
    # (zero wind means, one shared scale per u/v pair) so that normalization only rescales the wind vectors
    normalization: {"tcwv": "minmax", "q50": "minmax", "q100": "minmax", "q150": "minmax", "q200": "minmax", "q250": "minmax", "q300": "minmax", "q400": "minmax", "q500": "minmax", "q600": "minmax", "q700": "minmax", "q850": "minmax", "q925": "minmax", "q1000": "minmax"}

    # extra channels: zenith angle and the invariants; no grid channels, they would break equivariance
    add_grid: !!bool False
    add_zenith: !!bool True
    add_orography: !!bool True
    orography_path: /invariants/orography.nc
    add_landmask: !!bool True
    landmask_path: /invariants/land_sea_mask.nc

    pretrained: !!bool False

    # logging
    log_to_screen: !!bool True
    log_to_wandb: !!bool True
    log_video: 0
    save_checkpoint: "legacy"
    checkpoint_num_versions: 6
    verbose: !!bool False

    wandb_name: None
    wandb_group: "sfno_less"
    wandb_project: "sfno_less"
    wandb_entity: "bbonev"

###########################################################################################################################
# targets
###########################################################################################################################

sfno_less_deterministic: &SFNO_LESS_DETERMINISTIC
    <<: *BASE_CONFIG

    # original SFNO baseline recipe: 64 samples per step, 1 per GPU on 8 nodes
    batch_size: 64
    lr: 1E-3

    losses:
    -   type: "l2"
        channel_weights: "constant"
        temp_diff_normalization: !!bool True
        parameters:
            squared: !!bool True

sfno_less_crps: &SFNO_LESS_CRPS
    <<: *BASE_CONFIG

    ensemble_size: 16

    # standard CRPS; underestimates spread with small ensembles, switch to "skillspread" for fine-tuning
    losses:
    -   type: "ensemble_crps"
        channel_weights: "constant"
        relative_weight: 1.0
        temp_diff_normalization: !!bool True
        parameters:
            crps_type: "cdf"
    -   type: "ensemble_spectral_crps"
        channel_weights: "constant"
        relative_weight: 0.1
        temp_diff_normalization: !!bool True
        parameters:
            crps_type: "cdf"

    # diffusion noise appended as dynamic input channels
    input_noise:
        type: "diffusion"
        mode: "concatenate"
        centered: !!bool False
        n_channels: 8
        sigma: 1.0
        kT: [3.0806E-5, 1.2322E-4, 4.9289E-4, 1.9716E-3, 7.8862E-3, 3.1545E-2, 1.2618E-1, 5.0472E-1]

# TODO: LESS objective to be defined; identical to the CRPS target for now
sfno_less_less: &SFNO_LESS_LESS
    <<: *SFNO_LESS_CRPS
