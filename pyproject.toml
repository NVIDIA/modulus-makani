[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "makani"
authors = [
    { name="Thorsten Kurth", email = "tkurth@nvidia.com" },
    { name="Boris Bonev", email = "bbonev@nvidia.com" },
    { name="Ankur Mahesh", email = "amahesh@lbl.gov" },
    { name="Animashree Anandkumar" },
    { name="Kamyar Azizzadenesheli" },
    { name="Noah Brenowitz" },
    { name="Ashesh Chattopadhyay" },
    { name="Yair Cohen" },
    { name="Franziska Gerken", email = "fgerken@nvidia.com"},
    { name="David Hall" },
    { name="Peter Harrington" },
    { name="Pedram Hassanzadeh" },
    { name="Christian Hundt" },
    { name="Alexey Kamenev"},
    { name="Karthik Kashinath" },
    { name="Jean Kossaifi", email = "jkossaifi@nvidia.com" },
    { name="Zongyi Li" },
    { name="Morteza Mardani" },
    { name="Jaideep Pathak" },
    { name="Mike Pritchard" },
    { name="David Pruitt" },
    { name="Sanjeev Raja" },
    { name="Shashank Subramanian" },
]

maintainers = [
    { name="Thorsten Kurth", email = "tkurth@nvidia.com" },
    { name="Boris Bonev", email = "bbonev@nvidia.com" },
    { name="Franziska Gerken", email = "fgerken@nvidia.com" },
]

description = "Massively parallel training of machine-learning based weather and climate models"
readme = "README.md"
requires-python = ">=3.11"

classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]

dynamic = ["version"]

dependencies = [
    "torch>=2.9.1",
    "numpy>=1.22.4",
    "h5py>=3.11.0",
    # Both 1.x and 2.x are supported; the API differences between them are
    # normalized in makani.models.physicsnemo_compat. Deliberately left without
    # an upper bound so makani can share an environment with packages that
    # require physicsnemo 2.x (e.g. earth2studio's corrdiff/stormcast extras).
    # Note that physicsnemo 2.x itself raises the floor to Python >= 3.11, and
    # 2.1+ to torch >= 2.10, above makani's own minimums declared here.
    "nvidia-physicsnemo>=1.3.0",
    "zarr>=3",
    "torch-harmonics>=0.9.0",
    "wandb>=0.13.7",
    "tqdm>=4.60.0",
    "more-itertools",
    "Pillow",
    "ruamel.yaml",
]

[tool.setuptools.dynamic]
version = {attr = "makani.__version__"}

[tool.setuptools.packages.find]
    include = ["makani*"]

[project.optional-dependencies]
dev = [
    "black>=22.10.0",
    "coverage>=6.5.0",
    "nvidia-dali-cuda120>=2.0.0",
]

test = [
    "pytest>=6.0.0",
    "pytest-cov",
    "parameterized",
    "properscoring",
    "xarray>=2025.1.0",
    "xskillscore",
]

data_process = [
    "mpi4py",
    "xarray>=2025.1.0",
    "gcsfs",
    "s3fs",
    "dask",
    "tqdm",
]

legacy_data_process = [
    "cdsapi>=0.7.2"
]

vis = [
    "matplotlib>=3.8.1",
    "moviepy>=1.0.3",
]

sirfshampoo = [
    "sirfshampoo",
]

[tool.pytest.ini_options]
minversion = "6.0"
# Disable hypothesis plugin so pytest does not load it (hypothesis uses pkg_resources, removed in setuptools>=82)
addopts = "-p no:hypothesis"
testpaths = [
    "tests",
    "makani",
]
# Python 3.12 warns when fork() is called from a multi-threaded process. DALI
# spins up threads at import time, so torch DataLoader's default fork-based
# worker spawn trips this on every test. The warning is informational; we have
# not observed deadlocks with the test fixtures.
filterwarnings = [
    "ignore:.*fork.*may lead to deadlocks.*:DeprecationWarning",
]

[tool.black]
line-length = 120
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.ruff]
# match black, which owns formatting; ruff is used for linting only
line-length = 120

[tool.ruff.lint]
# Style rules that would require touching a large amount of existing code for
# little benefit. Revisit individually rather than as a batch.
#   E711/E712  `== None` / `== True` comparisons
#   E722       bare `except:`
#   E741       ambiguous names (`l`, `I`, `O`) -- `l` is idiomatic for the
#              spherical-harmonic degree throughout this codebase
#   F841       assigned-but-unused locals; ruff's fix for these is "unsafe"
#              because the right-hand side may have side effects
ignore = ["E711", "E712", "E722", "E741", "F841"]

# Deliberately NOT ignored, because they flag real defects rather than style:
#   F821  undefined name  -- these are latent NameErrors on branches that are
#         currently unreachable (e.g. the distributed FFT path in mpu/layers.py
#         and the non-default operator types in spectral_convolution.py)
#   F811  redefinition of an unused name

[tool.ruff.lint.per-file-ignores]
# Package __init__ files re-export their imports as the public API.
"**/__init__.py" = ["F401"]
# Imports are deferred to the bottom of the module on purpose to break a
# circular import with makani.utils; see the comment at the import site.
"makani/mpu/mappings.py" = ["E402"]


[tool.coverage.run]
omit = [
    "makani/ensemble.py",
    "makani/inference.py",
    "makani/train.py",
    "makani/train_autoencoder.py",
    "makani/train_stochastic.py",
    "makani/utils/argument_parser.py",
]

[project.entry-points."makani.models"]
AFNO     = "makani.models.networks.afnonet:AdaptiveFourierNeuralOperatorNet"
AFNOv2   = "makani.models.networks.afnonet_v2:AdaptiveFourierNeuralOperatorNet"
FCN3     = "makani.models.networks.fourcastnet3:AtmoSphericNeuralOperatorNet"
"FCN3.1" = "makani.models.networks.fourcastnet3_1:AtmoSphericNeuralOperatorNet31"
FNO      = "makani.models.networks.sfnonet:FourierNeuralOperatorNet"
SFNO     = "makani.models.networks.sfnonet:SphericalFourierNeuralOperatorNet"
SNO      = "makani.models.networks.snonet:SphericalNeuralOperatorNet"
DebugNet = "makani.models.networks.debug:DebugNet"
ViT      = "makani.models.networks.vit:VisionTransformer"
Pangu    = "makani.models.networks.pangu:Pangu"

[project.entry-points."physicsnemo.models"]
SFNO     = "makani.models.networks.sfnonet:SFNO"
FCN3     = "makani.models.networks.fourcastnet3:FCN3"
"FCN3.1" = "makani.models.networks.fourcastnet3_1:FCN3"
