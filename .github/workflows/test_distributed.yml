name: Run distributed tests

# The distributed suite on CPU, with the gloo backend, over polar x azimuth process grids with
# 1, 2 and 4 ranks per direction, each without and with a 2-way ensemble dimension; the batch
# dimension is filled with whatever ranks remain, which is always 1 here. Everything CUDA-only
# (DALI, TransformerEngine) skips.
#
# Heavy (up to 16 processes per grid), so it does not run on every push: tests.yml calls it on
# pull requests and on pushes to main. It can also be run on demand.
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# a new push to the same pull request supersedes the running grids
concurrency:
  # not github.workflow: when called from tests.yml, that is the caller's name
  group: distributed-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # build torch-harmonics once and share the wheel, instead of compiling it in every grid job
  build:
    name: Build torch-harmonics CPU wheel
    runs-on: ubuntu-latest
    steps:
    - name: Set up Python 3.12
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"

    - name: Build the wheel
      run: |
        python -m pip install --upgrade pip setuptools wheel
        python -m pip install torch==2.9.1 --extra-index-url https://download.pytorch.org/whl/cpu
        python -m pip install setuptools_scm
        # torch-harmonics v0.9.3, the same SHA as in tests.yml
        python -m pip wheel --no-build-isolation --no-deps -w dist \
          git+https://github.com/NVIDIA/torch-harmonics.git@2028c7768e5ca3ad5a82e1d6bd8c304aa703754f

    - uses: actions/upload-artifact@v4
      with:
        name: torch-harmonics-cpu-wheel
        path: dist/*.whl

  distributed:
    name: Grid ${{ matrix.grid_h }}x${{ matrix.grid_w }}, ensemble ${{ matrix.grid_e }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        grid_e: [1, 2]
        grid_h: [1, 2, 4]
        grid_w: [1, 2, 4]
        exclude:
          # 4 x 4 exceeds 8 spatial ranks
          - {grid_h: 4, grid_w: 4}
          # a single rank is the serial suite
          - {grid_h: 1, grid_w: 1, grid_e: 1}

    steps:
    - uses: actions/checkout@v5

    - name: Set up Python 3.12
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"

    - uses: actions/download-artifact@v4
      with:
        name: torch-harmonics-cpu-wheel
        path: dist

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        python -m pip install torch==2.9.1 --extra-index-url https://download.pytorch.org/whl/cpu
        python -m pip install --no-deps dist/*.whl
        # freeze the torch torch-harmonics was built against, see tests.yml
        echo "torch==$(python -c "import torch; print(torch.__version__.split('+')[0])")" > constraints.txt
        echo "PIP_CONSTRAINT=${GITHUB_WORKSPACE}/constraints.txt" >> "$GITHUB_ENV"
        # physicsnemo v1.3.0, the same SHA as in tests.yml
        PIP_CONSTRAINT=constraints.txt python -m pip install git+https://github.com/NVIDIA/physicsnemo.git@14e0874847ffb56b35abf7708a1665e71605999c

    - name: Install package
      run: |
        python -m pip install -e .[test]

    - name: Run the distributed tests
      env:
        GRID_H: ${{ matrix.grid_h }}
        GRID_W: ${{ matrix.grid_w }}
        GRID_E: ${{ matrix.grid_e }}
        MASTER_ADDR: localhost
        MASTER_PORT: "29501"
        # the ranks share the runner's few vCPUs; threads per rank would oversubscribe them further
        OMP_NUM_THREADS: "1"
      run: |
        # One process per rank, launched with the variables torch.distributed's env initialization
        # reads; physicsnemo also needs LOCAL_RANK, which it would otherwise derive from the CUDA
        # device count. Each file gets a fresh set of ranks, so a failure in one cannot poison the
        # next, and the timeout turns a hang -- the way a rank-divergent collective fails -- into a
        # red mark instead of a stuck job.
        #
        # Every rank of every file writes its own coverage data file; the coverage job in
        # tests.yml combines them across ranks and grids, and with the serial suite's.
        nranks=$((GRID_H * GRID_W * GRID_E))
        grid="${GRID_H}x${GRID_W}x${GRID_E}"
        status=0
        mkdir -p covdata
        for f in tests/distributed/tests_distributed_*.py; do
          echo "::group::$f"
          name=$(basename "$f" .py)
          pids=()
          for r in $(seq 0 $((nranks - 1))); do
            RANK=$r WORLD_RANK=$r LOCAL_RANK=$r WORLD_SIZE=$nranks \
              COVERAGE_FILE="$PWD/covdata/.coverage.$grid.$name.rank$r" \
              timeout 900 python -m pytest -s -ra -q --cov=makani --cov-report= "$f" > "rank$r.log" 2>&1 &
            pids+=($!)
          done
          for i in "${!pids[@]}"; do
            if ! wait "${pids[$i]}"; then
              status=1
              echo "::error::rank $i failed on $f"
              cat "rank$i.log"
            fi
          done
          cat rank0.log
          echo "::endgroup::"
        done
        exit $status

    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: coverage-distributed-${{ matrix.grid_h }}x${{ matrix.grid_w }}x${{ matrix.grid_e }}
        path: covdata/
        include-hidden-files: true  # the data files are .coverage.*
